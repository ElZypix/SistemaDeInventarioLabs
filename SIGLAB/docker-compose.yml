# SIGLAB - Sistema de Gestión de Laboratorios (TecNM Campus Comitán)
# Uso:  docker compose up -d --build      →  http://localhost:8080
#       phpMyAdmin                        →  http://localhost:8081

services:
  web:
    build: .
    container_name: siglab_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-siglab_db}
      DB_USER: ${DB_USER:-siglab}
      DB_PASS: ${DB_PASS:-siglab_pass}
      TZ: America/Mexico_City
    volumes:
      - ./app:/var/www/html
      - ./backups:/var/www/backups
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    container_name: siglab_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:-siglab_root}
      MARIADB_DATABASE: ${DB_NAME:-siglab_db}
      MARIADB_USER: ${DB_USER:-siglab}
      MARIADB_PASSWORD: ${DB_PASS:-siglab_pass}
      TZ: America/Mexico_City
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db_data:/var/lib/mysql
      - ./db/siglab.sql:/docker-entrypoint-initdb.d/01-siglab.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5
    container_name: siglab_pma
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  db_data:
